<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nosso Voto — Extensão Pinterest</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      width: 320px;
      background-color: #FBF9F7;
      color: #2C2523;
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #EAE0DA;
      border-radius: 16px;
      padding: 16px;
    }
    .brand {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #C25E38;
      margin: 0 0 4px;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 8px;
      color: #2C2523;
    }
    p {
      font-size: 12px;
      line-height: 1.45;
      color: #6E625F;
      margin: 0 0 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin: 10px 0 4px;
      color: #2C2523;
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid #EAE0DA;
      border-radius: 10px;
      background-color: #FBF9F7;
      color: #2C2523;
      font-size: 12px;
      font-family: inherit;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #C25E38;
      background-color: #FFFFFF;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
    }
    button {
      width: 100%;
      min-height: 42px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-primary {
      border: none;
      background-color: #C25E38;
      color: #FFFFFF;
    }
    .btn-primary:hover {
      background-color: #A84D2B;
    }
    .btn-secondary {
      border: 1px solid #C25E38;
      background-color: #F9EBE6;
      color: #C25E38;
    }
    .status {
      margin-top: 10px;
      font-size: 12px;
      font-weight: 500;
      min-height: 16px;
      color: #5A8F7B;
    }
    .status.is-error {
      color: #B91C1C;
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="brand">Nosso Voto</p>
    <h1>Clipper do Pinterest</h1>
    <p>Cole o <strong>api_token</strong> do seu painel em <code>/inspiracoes</code> para autenticar a captura em 1 clique.</p>

    <form id="settings-form">
      <label for="base_url">URL do Nosso Voto</label>
      <input id="base_url" type="url" placeholder="http://localhost:8000" required>

      <label for="api_token">API Token da Noiva</label>
      <input id="api_token" type="text" placeholder="nv_..." required>

      <label for="default_category">Categoria Padrão</label>
      <select id="default_category">
        <option value="decoracao">Decoração</option>
        <option value="maquiagem">Maquiagem</option>
        <option value="penteado">Penteado</option>
      </select>

      <div class="actions">
        <button type="submit" class="btn-primary">Salvar Configurações</button>
        <button type="button" id="clip-current-tab" class="btn-secondary">Salvar Página Atual do Pinterest</button>
      </div>
    </form>

    <div id="status" class="status" role="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
