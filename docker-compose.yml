services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: nossovoto_app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "php artisan serve --host=0.0.0.0 --port=8000"

  vite:
    image: node:22-alpine
    container_name: nossovoto_vite
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "5173:5173"
    depends_on:
      - app
    command: sh -c "rm -f public/hot && npm install && npm run dev"

  db:
    image: postgres:18-alpine
    container_name: nossovoto_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nossovoto
      POSTGRES_USER: nossovoto
      POSTGRES_PASSWORD: nossovoto
    ports:
      - "5435:5432"
    volumes:
      - nossovoto_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nossovoto -d nossovoto"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  nossovoto_pgdata:

